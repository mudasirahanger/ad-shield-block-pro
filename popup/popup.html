<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ad Shield Block Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Ad Shield Block Pro</h1>
    <label class="switch" title="Turn blocking on or off everywhere">
      <input type="checkbox" id="global">
      <span class="slider"></span>
    </label>
  </header>
  <p id="status" class="status"></p>
  <div class="site">
    <span id="host">—</span>
    <button id="pause" type="button">Pause on this site</button>
  </div>
  <label class="opt"><input type="checkbox" id="cookies"> Hide cookie banners</label>
  <p class="note">Blocks ads &amp; trackers, removes tracking parameters from links, sends Do Not Track and Global Privacy Control, and strips the Referer header from third-party requests. Nothing is collected or sent anywhere.</p>
  <script src="popup.js"></script>
</body>
</html>
